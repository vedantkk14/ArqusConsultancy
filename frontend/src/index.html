<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ARQUS Sports Consultancy</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="brand/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="brand/icon-512.png" />
    <link rel="apple-touch-icon" href="brand/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <style>
      /* Startup splash: shown until the stored session has been checked, then replaced by the app. */
      .app-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--paper);
      }
      .app-splash img {
        width: 96px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="app-splash" role="status" aria-label="Loading">
        <img src="brand/arqus-emblem.png" alt="" width="72" height="36" />
      </div>
    </app-root>
  </body>
</html>
