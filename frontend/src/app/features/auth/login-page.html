<main class="login">
  <div class="card panel">
    <img class="logo" src="brand/arqus-logo.png" alt="ARQUS Sports Consultancy" width="136" height="80" decoding="async" />
    <h1 class="title">Sign in</h1>
    <p class="subtitle">Welcome back. Enter your details to continue.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" autocomplete="username" />
        @if (form.controls.username.hasError('required')) {
          <mat-error>Username is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input
          matInput
          formControlName="password"
          autocomplete="current-password"
          [type]="hidePassword() ? 'password' : 'text'"
        />
        <button
          matIconButton
          matSuffix
          type="button"
          [attr.aria-label]="hidePassword() ? 'Show password' : 'Hide password'"
          (click)="hidePassword.set(!hidePassword())"
        >
          <mat-icon>{{ hidePassword() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        @if (form.controls.password.hasError('required')) {
          <mat-error>Password is required</mat-error>
        }
      </mat-form-field>

      @if (error(); as message) {
        <p class="error" role="alert">
          <mat-icon aria-hidden="true">error_outline</mat-icon>
          <span>{{ message }}</span>
        </p>
      }

      <button matButton="filled" type="submit" class="submit" [disabled]="loading()">
        @if (loading()) {
          <mat-spinner diameter="18" aria-label="Signing in" />
        } @else {
          Sign in
        }
      </button>
    </form>
  </div>
</main>
