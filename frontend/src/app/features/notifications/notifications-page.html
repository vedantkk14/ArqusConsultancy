<header class="head">
  <div class="seg" role="tablist" aria-label="Show">
    <button type="button" role="tab" [attr.aria-selected]="tab() === 'all'" (click)="setTab('all')">All</button>
    <button type="button" role="tab" [attr.aria-selected]="tab() === 'unread'" (click)="setTab('unread')">
      Unread
      @if (service.unread()) {
        <span class="n">{{ service.unread() }}</span>
      }
    </button>
  </div>
  <button matButton="outlined" type="button" [disabled]="!service.unread()" (click)="markAll()">
    <mat-icon>done_all</mat-icon>Mark all read
  </button>
</header>

@if (error() && !rows().length) {
  <app-error-state title="Couldn't load notifications" (retry)="load(tab(), 1)" />
} @else if (!loaded()) {
  <ul class="card list" aria-hidden="true">
    @for (i of placeholders; track i) {
      <li class="sk"><app-skeleton width="40px" height="40px" radius="50%" /><span><app-skeleton width="45%" /><app-skeleton width="80%" /></span></li>
    }
  </ul>
} @else if (!rows().length) {
  <app-empty-state
    [icon]="tab() === 'unread' ? 'mark_email_read' : 'notifications_off'"
    [title]="tab() === 'unread' ? 'You\'re all caught up.' : 'No notifications yet'"
    [message]="tab() === 'unread' ? 'Nothing unread right now.' : 'Updates about your leads, projects and payments show up here.'"
  />
} @else {
  <ul class="card list" [class.busy]="loading()" aria-label="Notifications">
    @for (n of rows(); track n.id) {
      <li>
        <button type="button" class="row" [class.unread]="!n.is_read" (click)="open(n)">
          <span [class]="'ic t-' + meta(n.type).tone" aria-hidden="true"><mat-icon>{{ meta(n.type).icon }}</mat-icon></span>
          <span class="txt">
            <span class="ttl">{{ n.title }}@if (!n.is_read) { <span class="sr-only"> (unread)</span> }</span>
            @if (n.body) { <span class="body">{{ n.body }}</span> }
          </span>
          <time class="when" [attr.datetime]="n.created_at" [attr.title]="n.created_at">{{ ago(n.created_at, now()) }}</time>
          @if (!n.is_read) { <i class="dot" aria-hidden="true"></i> }
        </button>
      </li>
    }
  </ul>
  @if (hasMore()) {
    <div class="more"><button matButton="outlined" type="button" [disabled]="loading()" (click)="more()">{{ loading() ? 'Loading…' : 'Load more' }}</button></div>
  }
}
