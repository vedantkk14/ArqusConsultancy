<app-topbar (menuToggle)="drawer.toggle()" />

<mat-sidenav-container class="container">
  <mat-sidenav
    #drawer
    class="sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
  >
    <app-sidebar (navigated)="isMobile() && drawer.close()" />
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
