<app-auth-layout>
  <h1>Sign in</h1>
  <p class="lede">Welcome back. Enter your details to continue.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (notice(); as text) {
      <p class="banner info" role="status">
        <mat-icon aria-hidden="true">info</mat-icon><span>{{ text }}</span>
      </p>
    }
    @if (errorText(); as text) {
      <p class="banner error" role="alert">
        <mat-icon aria-hidden="true">error_outline</mat-icon><span>{{ text }}</span>
      </p>
    }

    <div class="field">
      <label for="identifier">Email or username</label>
      <input
        #identifier
        id="identifier"
        type="text"
        formControlName="identifier"
        autocomplete="username"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        inputmode="email"
        enterkeyhint="next"
        [attr.aria-invalid]="showError('identifier')"
        [attr.aria-describedby]="showError('identifier') ? 'identifier-error' : null"
      />
      @if (showError('identifier')) {
        <p id="identifier-error" class="field-error" aria-live="polite">Enter your email or username.</p>
      }
    </div>

    <app-password-field
      inputId="password"
      label="Password"
      autocomplete="current-password"
      enterKeyHint="go"
      errorId="password-error"
      [control]="form.controls.password"
      [invalid]="showError('password')"
    >
      @if (showError('password')) {
        <p fieldError id="password-error" class="field-error" aria-live="polite">Enter your password.</p>
      }
    </app-password-field>

    <div class="row">
      <label class="check">
        <input type="checkbox" formControlName="remember" />
        Remember me
      </label>
      <a class="link" routerLink="/forgot-password">Forgot password?</a>
    </div>

    <button matButton="filled" type="submit" class="submit" [disabled]="pending() || lock.running()">
      @if (pending()) {
        <mat-spinner diameter="18" aria-hidden="true" />
        Signing in…
      } @else {
        Sign in
      }
    </button>
  </form>
</app-auth-layout>
