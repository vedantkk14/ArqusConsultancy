<header class="topbar">
  @if (!layout.isDesktop()) {
    <img class="emblem" src="brand/arqus-emblem.png" alt="ARQUS" width="48" height="24" decoding="async" />
  }
  <div class="titles">
    <h1 class="page-title">{{ pageTitle() }}</h1>
    @if (layout.subtitle()) {
      <span class="subtitle">{{ layout.subtitle() }}</span>
    }
  </div>
  <span class="spacer"></span>

  <app-notification-bell />

  @if (auth.user(); as user) {
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="account" aria-label="Account menu" [matMenuTriggerFor]="accountMenu">
      <app-user-avatar [name]="user.name" [size]="34" />
      <span class="who">
        <span class="hi">Hi, <strong>{{ firstName(user.name) }}</strong></span>
        <app-role-badge [role]="user.role" />
      </span>
      <mat-icon class="chev" aria-hidden="true">expand_more</mat-icon>
    </button>
    <mat-menu #accountMenu="matMenu" xPosition="before">
      <div class="menu-user">
        <span class="greet">{{ greeting() }}</span>
        <strong>{{ user.name }}</strong>
        <span class="mail">{{ user.email }}</span>
        <app-role-badge [role]="user.role" />
      </div>
      <a mat-menu-item routerLink="/settings/profile">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </a>
      <a mat-menu-item routerLink="/account/change-password">
        <mat-icon>lock</mat-icon>
        <span>Change password</span>
      </a>
      <button mat-menu-item (click)="auth.logout()">
        <mat-icon>logout</mat-icon>
        <span>Log out</span>
      </button>
    </mat-menu>
  }
</header>
