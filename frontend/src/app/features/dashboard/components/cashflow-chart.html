<div class="legend" aria-hidden="true">
  <span><i class="sw collected"></i>Collected</span>
  <span><i class="sw spent"></i>Spent</span>
</div>

@if (isEmpty()) {
  <p class="empty">No data for this period</p>
} @else {
  <svg [attr.viewBox]="'0 0 ' + W() + ' ' + H" [attr.width]="W()" [attr.height]="H" role="img" [attr.aria-label]="summary()">
    <defs>
      <linearGradient id="cf-collected" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5fd6f8" />
        <stop offset="100%" stop-color="#1aa6d6" />
      </linearGradient>
      <linearGradient id="cf-spent" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2a3440" />
        <stop offset="100%" stop-color="#0b0d0f" />
      </linearGradient>
      <clipPath id="cf-plot">
        <rect x="0" y="0" [attr.width]="W()" [attr.height]="H - PAD.bottom" />
      </clipPath>
    </defs>
    @for (g of gridlines(); track g.y) {
      <line class="grid" [attr.x1]="PAD.left" [attr.x2]="W() - PAD.right" [attr.y1]="g.y" [attr.y2]="g.y" />
      <text class="axis" [attr.x]="PAD.left - 8" [attr.y]="g.y + 4" text-anchor="end">{{ g.label }}</text>
    }
    @for (b of bars(); track b.month) {
      <g class="bar collected">
        <rect clip-path="url(#cf-plot)" [attr.x]="b.collected.x" [attr.y]="b.collected.y" [attr.width]="b.collected.w"
              [attr.height]="b.collected.h" rx="6" />
        <text class="val" [attr.x]="b.collected.x + b.collected.w / 2" [attr.y]="b.collected.y - 6" text-anchor="middle">{{ b.collected.label }}</text>
      </g>
      <g class="bar spent">
        <rect clip-path="url(#cf-plot)" [attr.x]="b.spent.x" [attr.y]="b.spent.y" [attr.width]="b.spent.w"
              [attr.height]="b.spent.h" rx="6" />
        <text class="val" [attr.x]="b.spent.x + b.spent.w / 2" [attr.y]="b.spent.y - 6" text-anchor="middle">{{ b.spent.label }}</text>
      </g>
      <text class="axis" [attr.x]="b.labelX" [attr.y]="H - 8" text-anchor="middle">{{ monthLabel(b.month) }}</text>
    }
  </svg>
}

<table class="sr-only">
  <caption>Revenue vs expenses by month</caption>
  <thead>
    <tr><th scope="col">Month</th><th scope="col">Collected</th><th scope="col">Spent</th></tr>
  </thead>
  <tbody>
    @for (month of months(); track month; let i = $index) {
      <tr>
        <th scope="row">{{ month }}</th>
        <td>{{ collected()[i] | inr }}</td>
        <td>{{ spent()[i] | inr }}</td>
      </tr>
    }
  </tbody>
</table>
