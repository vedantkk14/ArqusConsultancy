<div class="row">
  <label class="search">
    <span class="sr-only">Search ledgers</span>
    <mat-icon aria-hidden="true">search</mat-icon>
    <input
      type="search"
      placeholder="Search client, phone or email"
      autocomplete="off"
      [value]="search()"
      (input)="onSearch($any($event.target).value)"
    />
  </label>

  @if (compact()) {
    <button type="button" class="ctl more" (click)="openSheet()">
      <mat-icon aria-hidden="true">tune</mat-icon>Filters{{ dropdownCount() ? ' (' + dropdownCount() + ')' : '' }}
    </button>
  } @else {
    <ng-container *ngTemplateOutlet="dropdowns" />
  }

  <label class="sort">
    <span class="sr-only">Sort by</span>
    <select class="ctl" (change)="set('ordering', $any($event.target).value)">
      <option value="" [selected]="!filters().ordering">Default order</option>
      @for (o of orderings; track o.value) {
        <option [value]="o.value" [selected]="filters().ordering === o.value">{{ o.label }}</option>
      }
    </select>
  </label>

  @if (anyActive()) {
    <button type="button" class="clear" (click)="cleared.emit()">Clear filters</button>
  }
</div>

<div class="chips" role="group" aria-label="Filter by state">
  @if (mode() === 'all') {
    <button type="button" class="chip" [attr.aria-pressed]="filters().state === ''" (click)="set('state', '')">
      All
      @if (countFor('') !== null) {
        <span class="n">{{ countFor('') }}</span>
      }
    </button>
    @for (s of states; track s) {
      <button type="button" class="chip" [attr.aria-pressed]="filters().state === s" (click)="set('state', s)">
        {{ labels[s] }}
        @if (countFor(s) !== null) {
          <span class="n">{{ countFor(s) }}</span>
        }
      </button>
    }
  }
  <button type="button" class="chip" [attr.aria-pressed]="filters().overdue === 'true'" (click)="toggleOverdue(filters().overdue !== 'true')">
    Overdue only
    @if (summary(); as s) {
      <span class="n">{{ s.overdue_clients }}</span>
    }
  </button>
</div>

<ng-template #dropdowns>
  <label class="dd">
    <span class="lbl">Aging</span>
    <select class="ctl" (change)="set('aging', $any($event.target).value)">
      <option value="" [selected]="!filters().aging">Any</option>
      @for (b of buckets; track b) {
        <option [value]="b" [selected]="filters().aging === b">{{ b }} days</option>
      }
    </select>
  </label>
  <label class="dd">
    <span class="lbl">Created from</span>
    <input class="ctl" type="date" [value]="filters().created_from" (change)="set('created_from', $any($event.target).value)" />
  </label>
  <label class="dd">
    <span class="lbl">Created to</span>
    <input class="ctl" type="date" [value]="filters().created_to" (change)="set('created_to', $any($event.target).value)" />
  </label>
</ng-template>

<ng-template #sheet>
  <div class="sheet">
    <h2>Filters</h2>
    <ng-container *ngTemplateOutlet="dropdowns" />
    <div class="sheet-actions">
      <button matButton type="button" (click)="cleared.emit(); closeSheet()">Clear filters</button>
      <button matButton="filled" type="button" (click)="closeSheet()">Done</button>
    </div>
  </div>
</ng-template>
